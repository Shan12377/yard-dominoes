project_id = "yard-dominoes"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_anonymous_sign_ins = true   # guest play, so Facebook is never required

# Reopened 2026-08-02 for online.ts's secureAccount()/signInWithPassword() —
# converting an EXISTING signed-in anonymous session to a permanent one, so
# a paying Yardie/VIP (or an admin flag) doesn't get permanently lost the
# moment a browser is cleared or a phone is swapped. Never a cold "create an
# account with just an email" form, and never required to play. See
# .claude/rules/supabase.md's Auth section for the full history — this was
# closed outright before, and reopening it was a deliberate, narrow
# tradeoff, not an accident to revert without reading that first.
[auth.email]
enable_signup = true
# Still require a confirmed inbox before an email actually attaches —
# closes the door on someone claiming an address they don't own.
enable_confirmations = true

[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false

[functions.play-move]
verify_jwt = true
[functions.advance-duppy]
verify_jwt = true
[functions.start-hand]
verify_jwt = true
[functions.create-table]
