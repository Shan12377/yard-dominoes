[functions.join-table]
verify_jwt = true
[functions.pass-pose]
verify_jwt = true
[functions.leave-seat]
verify_jwt = true
[functions.review-hand]
verify_jwt = true
[functions.video-session]
verify_jwt = true
[functions.report-admin]
verify_jwt = true
[functions.expire-turns]
