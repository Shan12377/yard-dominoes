project_id = "yard-dominoes"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_anonymous_sign_ins = true   # guest play, so Facebook is never required

# The client never offers email/password signup — sign-in is anonymous or
# Apple/Google OAuth only (online.ts). Leaving the email provider's signup
# open anyway lets someone bypass the client entirely and hit
# POST /auth/v1/signup directly with a disposable address. Since the product
# has no legitimate use for email signup, close it outright rather than
# chase an ever-growing disposable-domain blocklist.
[auth.email]
enable_signup = false
# Belt-and-suspenders: if signup is ever re-enabled by mistake, still
# require a confirmed inbox rather than activating disposable addresses
# on the spot.
enable_confirmations = true

[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false

[functions.play-move]
verify_jwt = true
[functions.start-hand]
verify_jwt = true
[functions.create-table]
verify_jwt = true
[functions.join-table]
verify_jwt = true
[functions.pass-pose]
verify_jwt = true
[functions.leave-seat]
verify_jwt = true
[functions.review-hand]
verify_jwt = true
[functions.video-session]
verify_jwt = true
[functions.expire-turns]
verify_jwt = false
[functions.tournament-signup]
verify_jwt = true
[functions.tournament-host]
verify_jwt = true
[functions.checkout]
verify_jwt = true
[functions.stripe-webhook]
verify_jwt = false
[functions.gift-coins]
verify_jwt = true
