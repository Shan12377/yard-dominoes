<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
  <title id="title">A line of Jamaican dominoes</title>
  <desc id="desc">Bone-white dominoes connected across a green table, with doubles laid crosswise.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#052B43" flood-opacity=".5"/></filter>
    <g id="p0"/>
    <g id="p1"><circle cx="30" cy="30" r="6"/></g>
    <g id="p2"><circle cx="16" cy="16" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p3"><circle cx="16" cy="16" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p4"><circle cx="16" cy="16" r="6"/><circle cx="44" cy="16" r="6"/><circle cx="16" cy="44" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p5"><circle cx="16" cy="16" r="6"/><circle cx="44" cy="16" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="16" cy="44" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p6"><circle cx="16" cy="14" r="6"/><circle cx="44" cy="14" r="6"/><circle cx="16" cy="30" r="6"/><circle cx="44" cy="30" r="6"/><circle cx="16" cy="46" r="6"/><circle cx="44" cy="46" r="6"/></g>
  </defs>
  <g fill="#17130F" filter="url(#shadow)">
    <g transform="translate(0 85)"><rect width="120" height="60" rx="9" fill="#FFF9EA"/><path d="M60 5v50" stroke="#17130F" stroke-width="3"/><use href="#p2"/><use href="#p4" x="60"/></g>
    <g transform="translate(120 85)"><rect width="120" height="60" rx="9" fill="#FFF9EA"/><path d="M60 5v50" stroke="#17130F" stroke-width="3"/><use href="#p4"/><use href="#p5" x="60"/></g>
    <g transform="translate(240 55)"><rect width="60" height="120" rx="9" fill="#FFF9EA"/><path d="M5 60h50" stroke="#17130F" stroke-width="3"/><use href="#p5"/><use href="#p5" y="60"/></g>
    <g transform="translate(300 85)"><rect width="120" height="60" rx="9" fill="#FFF9EA"/><path d="M60 5v50" stroke="#17130F" stroke-width="3"/><use href="#p5"/><use href="#p6" x="60"/></g>
    <g transform="translate(420 55)"><rect width="60" height="120" rx="9" fill="#FFF9EA"/><path d="M5 60h50" stroke="#17130F" stroke-width="3"/><use href="#p6"/><use href="#p6" y="60"/></g>
    <g transform="translate(480 85)"><rect width="120" height="60" rx="9" fill="#FFF9EA"/><path d="M60 5v50" stroke="#17130F" stroke-width="3"/><use href="#p6"/><use href="#p3" x="60"/></g>
    <g transform="translate(600 85)"><rect width="60" height="120" rx="9" fill="#FFF9EA"/><path d="M5 60h50" stroke="#17130F" stroke-width="3"/><use href="#p3"/><use href="#p3" y="60"/></g>
