<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
  <title id="title">A cascading line of Jamaican dominoes</title>
  <desc id="desc">Bone-white dominoes arrive one by one, turn a corner and continue down the green table.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#052B43" flood-opacity=".55"/></filter>
    <g id="p0"/>
    <g id="p1"><circle cx="30" cy="30" r="6"/></g>
    <g id="p2"><circle cx="16" cy="16" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p3"><circle cx="16" cy="16" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p4"><circle cx="16" cy="16" r="6"/><circle cx="44" cy="16" r="6"/><circle cx="16" cy="44" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p5"><circle cx="16" cy="16" r="6"/><circle cx="44" cy="16" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="16" cy="44" r="6"/><circle cx="44" cy="44" r="6"/></g>
    <g id="p6"><circle cx="16" cy="14" r="6"/><circle cx="44" cy="14" r="6"/><circle cx="16" cy="30" r="6"/><circle cx="44" cy="30" r="6"/><circle cx="16" cy="46" r="6"/><circle cx="44" cy="46" r="6"/></g>
    <g id="h24"><rect width="120" height="60" rx="9"/><path d="M60 5v50"/><use href="#p2"/><use href="#p4" x="60"/></g>
    <g id="h45"><rect width="120" height="60" rx="9"/><path d="M60 5v50"/><use href="#p4"/><use href="#p5" x="60"/></g>
    <g id="d55"><rect width="60" height="120" rx="9"/><path d="M5 60h50"/><use href="#p5"/><use href="#p5" y="60"/></g>
    <g id="h56"><rect width="120" height="60" rx="9"/><path d="M60 5v50"/><use href="#p5"/><use href="#p6" x="60"/></g>
    <g id="d66"><rect width="60" height="120" rx="9"/><path d="M5 60h50"/><use href="#p6"/><use href="#p6" y="60"/></g>
    <g id="h63"><rect width="120" height="60" rx="9"/><path d="M60 5v50"/><use href="#p6"/><use href="#p3" x="60"/></g>
    <g id="v31"><rect width="60" height="120" rx="9"/><path d="M5 60h50"/><use href="#p3"/><use href="#p1" y="60"/></g>
    <g id="h12"><rect width="120" height="60" rx="9"/><path d="M60 5v50"/><use href="#p1"/><use href="#p2" x="60"/></g>
  </defs>
  <style>
    .bone { fill:#FFF9EA; color:#17130F; filter:url(#shadow); }
    .bone path { fill:none; stroke:#17130F; stroke-width:3; }
    .play { transform-box:fill-box; transform-origin:center; animation:play-bone 6.4s cubic-bezier(.2,.8,.25,1) infinite both; }
    .b2 { animation-delay:.13s } .b3 { animation-delay:.26s } .b4 { animation-delay:.39s }
    .b5 { animation-delay:.52s } .b6 { animation-delay:.65s } .b7 { animation-delay:.78s }
    .b8 { animation-delay:.91s }
    @keyframes play-bone {
      0%, 4% { opacity:0; transform:translate(-22px,-28px) rotate(-12deg) scale(.88); }
      10% { opacity:1; transform:translate(3px,5px) rotate(2deg) scale(1.025); }
      13%, 82% { opacity:1; transform:none; }
      88%, 100% { opacity:0; transform:translate(8px,4px) scale(.98); }
    }
    @media (prefers-reduced-motion:reduce) { .play { animation:none; opacity:1; transform:none; } }
  </style>
  <g class="bone">
    <g transform="translate(8 72)"><g class="play b1"><use href="#h24"/></g></g>
    <g transform="translate(128 72)"><g class="play b2"><use href="#h45"/></g></g>
    <g transform="translate(248 42)"><g class="play b3"><use href="#d55"/></g></g>
    <g transform="translate(308 72)"><g class="play b4"><use href="#h56"/></g></g>
    <g transform="translate(428 42)"><g class="play b5"><use href="#d66"/></g></g>
    <g transform="translate(488 72)"><g class="play b6"><use href="#h63"/></g></g>
    <g transform="translate(608 102)"><g class="play b7"><use href="#v31"/></g></g>
    <g transform="translate(548 210)"><g class="play b8"><use href="#h12"/></g></g>
  </g>
</svg>
