<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">Play runs anticlockwise</title><desc id="description">Four seats surround the table; the right-hand seat plays next and partners sit opposite.</desc>
