  </g></g>
<g transform="translate(380 50)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#2DD46F"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">PARTNER</text></g><g transform="translate(660 205)"><rect x="-68" y="-18" width="136" height="36" rx="18" fill="#FFC928"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">RIGHT · NEXT</text></g><g transform="translate(380 285)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#FFC928"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">YOU</text></g><g transform="translate(100 205)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#2DD46F"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">LEFT</text></g>
<text x="380" y="330" text-anchor="middle" fill="#FFF9EA" font-family="system-ui,sans-serif" font-size="19" font-weight="800">Partner sits straight across</text>
