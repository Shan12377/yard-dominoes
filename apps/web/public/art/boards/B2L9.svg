<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">Partner or cut throat</title><desc id="description">Partner joins opposite seats into two sides; cut throat leaves all four players separate.</desc>
  <defs><pattern id="felt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#147A42"/><line x1="0" y1="0" x2="0" y2="12" stroke="#22A45B" stroke-opacity=".28" stroke-width="3"/></pattern></defs>
  <rect width="760" height="380" rx="18" fill="#052B43"/>
  <rect x="12" y="12" width="736" height="356" rx="13" fill="url(#felt)" stroke="#10698F" stroke-width="3"/>


<g transform="translate(220 80)"><rect x="-90.5" y="-18" width="181" height="36" rx="18" fill="#2DD46F"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">PARTNER · 2 SIDES</text></g><g transform="translate(540 80)"><rect x="-113" y="-18" width="226" height="36" rx="18" fill="#FFC928"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">CUT THROAT · 4 PLAYERS</text></g><g transform="translate(220 155)"><rect x="-77" y="-18" width="154" height="36" rx="18" fill="#2DD46F"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">YOU + OPPOSITE</text></g><g transform="translate(540 155)"><rect x="-95" y="-18" width="190" height="36" rx="18" fill="#FFC928"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">EVERY PLAYER ALONE</text></g>
<text x="220" y="230" text-anchor="middle" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="19" font-weight="800">2 shared sides</text><text x="540" y="230" text-anchor="middle" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="19" font-weight="800">4 separate scores</text><text x="380" y="330" text-anchor="middle" fill="#FFF9EA" font-family="system-ui,sans-serif" font-size="19" font-weight="800">Opposite together · or every tub alone</text>
