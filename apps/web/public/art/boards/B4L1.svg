<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">A pass is permanent</title><desc id="description">East passes when four and one are open. The board later changes to five and six, but the permanent record still says East has no fours and no ones.</desc>
  <defs><pattern id="felt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#147A42"/><line x1="0" y1="0" x2="0" y2="12" stroke="#22A45B" stroke-opacity=".28" stroke-width="3"/></pattern></defs>
  <rect width="760" height="380" rx="18" fill="#052B43"/>
  <rect x="12" y="12" width="736" height="356" rx="13" fill="url(#felt)" stroke="#10698F" stroke-width="3"/>
<line x1="230" y1="132" x2="230" y2="190" stroke="#B9DCEB" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/><line x1="530" y1="132" x2="530" y2="190" stroke="#FFC928" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>

<g transform="translate(230 105)"><rect x="-122" y="-18" width="244" height="36" rx="18" fill="#FF5A3C"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">EAST PASSES · ENDS 4 + 1</text></g><g transform="translate(530 105)"><rect x="-99.5" y="-18" width="199" height="36" rx="18" fill="#FFC928"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">RECORD · NO 4, NO 1</text></g><g transform="translate(230 220)"><rect x="-95" y="-18" width="190" height="36" rx="18" fill="#2DD46F"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">LATER ENDS · 5 + 6</text></g><g transform="translate(530 220)"><rect x="-95" y="-18" width="190" height="36" rx="18" fill="#FFC928"/><text text-anchor="middle" y="6" fill="#17130F" font-family="system-ui,sans-serif" font-size="15" font-weight="800">STILL · NO 4, NO 1</text></g>
<text x="380" y="325" text-anchor="middle" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="19" font-weight="800">The board changes. What the pass proved does not.</text>
  </svg>