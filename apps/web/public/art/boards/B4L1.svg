<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">A pass is permanent</title><desc id="description">East passes when four and one are open. Permanent badges record that East has no fours and no ones while the board continues changing.</desc>
