    <line x1="7" y1="56" x2="49" y2="56" stroke="#17130F" stroke-width="2"/>
    <circle cx="30" cy="30" r="4.1" fill="#17130F"/><circle cx="18" cy="74" r="4.1" fill="#17130F"/><circle cx="30" cy="86" r="4.1" fill="#17130F"/><circle cx="42" cy="98" r="4.1" fill="#17130F"/>
  </g></g><g transform="translate(115 120) scale(1)" opacity="0.42"><g transform="rotate(90 28 56)">
