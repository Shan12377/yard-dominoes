  <rect width="760" height="380" rx="18" fill="#052B43"/>
  <rect x="12" y="12" width="736" height="356" rx="13" fill="url(#felt)" stroke="#10698F" stroke-width="3"/>
  <line x1="550" y1="88" x2="585" y2="250" stroke="#FF5A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
