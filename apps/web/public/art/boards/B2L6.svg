<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">Lowest individual count wins the block</title><desc id="description">South has the lowest individual count at two, so the north-south team wins even though that team holds more pips overall.</desc>
  <defs><pattern id="felt" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#147A42"/><line x1="0" y1="0" x2="0" y2="12" stroke="#22A45B" stroke-opacity=".28" stroke-width="3"/></pattern></defs>
  <rect width="760" height="380" rx="18" fill="#052B43"/>
  <rect x="12" y="12" width="736" height="356" rx="13" fill="url(#felt)" stroke="#10698F" stroke-width="3"/>
  <line x1="380" y1="120" x2="380" y2="220" stroke="#FFC928" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
  <g transform="translate(352 45) rotate(0 28 56)" opacity="1">
    <rect x="1" y="1" width="54" height="110" rx="8" fill="#FFF9EA" stroke="#10698F" stroke-width="3"/>
    <line x1="7" y1="56" x2="49" y2="56" stroke="#17130F" stroke-width="2"/>
    <circle cx="18" cy="18" r="4.1" fill="#17130F"/><circle cx="42" cy="18" r="4.1" fill="#17130F"/><circle cx="30" cy="30" r="4.1" fill="#17130F"/><circle cx="18" cy="42" r="4.1" fill="#17130F"/><circle cx="42" cy="42" r="4.1" fill="#17130F"/><circle cx="18" cy="74" r="4.1" fill="#17130F"/><circle cx="42" cy="74" r="4.1" fill="#17130F"/><circle cx="30" cy="86" r="4.1" fill="#17130F"/><circle cx="18" cy="98" r="4.1" fill="#17130F"/><circle cx="42" cy="98" r="4.1" fill="#17130F"/>
  </g><g transform="translate(615 140) rotate(90 28 56)" opacity="1">
    <rect x="1" y="1" width="54" height="110" rx="8" fill="#FFF9EA" stroke="#10698F" stroke-width="3"/>
    <line x1="7" y1="56" x2="49" y2="56" stroke="#17130F" stroke-width="2"/>
    <circle cx="18" cy="18" r="4.1" fill="#17130F"/><circle cx="42" cy="42" r="4.1" fill="#17130F"/><circle cx="18" cy="74" r="4.1" fill="#17130F"/><circle cx="42" cy="98" r="4.1" fill="#17130F"/>
  </g><g transform="translate(352 225) rotate(0 28 56)" opacity="1">
    <rect x="1" y="1" width="54" height="110" rx="8" fill="#FFF9EA" stroke="#FFC928" stroke-width="3"/>
    <line x1="7" y1="56" x2="49" y2="56" stroke="#17130F" stroke-width="2"/>
    <circle cx="30" cy="30" r="4.1" fill="#17130F"/><circle cx="30" cy="86" r="4.1" fill="#17130F"/>
  </g><g transform="translate(90 140) rotate(90 28 56)" opacity="1">
    <rect x="1" y="1" width="54" height="110" rx="8" fill="#FFF9EA" stroke="#10698F" stroke-width="3"/>
    <line x1="7" y1="56" x2="49" y2="56" stroke="#17130F" stroke-width="2"/>
    <circle cx="30" cy="30" r="4.1" fill="#17130F"/><circle cx="18" cy="74" r="4.1" fill="#17130F"/><circle cx="42" cy="74" r="4.1" fill="#17130F"/><circle cx="30" cy="86" r="4.1" fill="#17130F"/><circle cx="18" cy="98" r="4.1" fill="#17130F"/><circle cx="42" cy="98" r="4.1" fill="#17130F"/>
  </g>

<text x="380" y="35" text-anchor="middle" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="18" font-weight="700">NORTH · 10</text><text x="735" y="205" text-anchor="end" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="18" font-weight="700">EAST · 4</text><text x="380" y="360" text-anchor="middle" fill="#FFC928" font-family="system-ui,sans-serif" font-size="18" font-weight="700">SOUTH · 2</text><text x="25" y="205" text-anchor="start" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="18" font-weight="700">WEST · 6</text><text x="380" y="205" text-anchor="middle" fill="#FFC928" font-family="system-ui,sans-serif" font-size="25" font-weight="900">North + South win</text><text x="380" y="232" text-anchor="middle" fill="#B9DCEB" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Lowest single hand — not lowest team total</text>
  </svg>