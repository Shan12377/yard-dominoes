  <rect width="760" height="380" rx="18" fill="#052B43"/>
  <rect x="12" y="12" width="736" height="356" rx="13" fill="url(#felt)" stroke="#10698F" stroke-width="3"/>
  <line x1="341" y1="188" x2="390" y2="188" stroke="#FFC928" stroke-width="5" stroke-linecap="round" />
  <g transform="translate(270 130) rotate(90 28 56)" opacity="1">
