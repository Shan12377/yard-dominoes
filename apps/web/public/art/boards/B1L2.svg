<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">Matching the open pip</title><desc id="description">A three-one tile matches the open three. A four-two tile does not match and is rejected.</desc>
