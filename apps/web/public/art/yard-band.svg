<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200"
     preserveAspectRatio="xMidYMax meet" role="presentation">
  <!--
    The yard band. Sits between the felt hero and the cream cards and carries
    the green down into the page so the bottom half stops looking like a
    different site.

    Flat vector, poster weight, four colours off the palette — this is a
    dancehall flyer silhouette, deliberately NOT a travel-brochure beach. The
    standing tiles are the point: they are what stops this being generic
    tropical art and makes it this game's picture.
  -->
  <defs>
    <!-- One frond, pointing right from the crown. Rotated copies make a palm. -->
    <path id="frond" d="M 0 -5 C 40 -34 84 -34 118 -18 C 84 -12 40 2 0 7 Z"/>

    <g id="palm">
      <!-- Trunk leans slightly, the way a coconut palm actually grows. -->
      <path d="M -7 0 C -13 -46 -10 -88 -4 -126 L 9 -126 C 7 -88 5 -46 13 0 Z"
            fill="#5A3A1E"/>
      <circle cx="1"  cy="-121" r="6" fill="#8F6600"/>
      <circle cx="11" cy="-116" r="5" fill="#8F6600"/>
      <g transform="translate(3,-128)">
        <!-- Outer fronds droop furthest and sit darkest — depth without shading. -->
        <use href="#frond" transform="rotate(-12)"   fill="#0E4F2A"/>
        <use href="#frond" transform="rotate(-168)"  fill="#0E4F2A"/>
        <use href="#frond" transform="rotate(-48)"   fill="#146B3A"/>
        <use href="#frond" transform="rotate(-132)"  fill="#146B3A"/>
        <use href="#frond" transform="rotate(-84) scale(0.92)"  fill="#1C8449"/>
        <use href="#frond" transform="rotate(-96) scale(0.92)"  fill="#1C8449"/>
      </g>
    </g>

    <!-- A standing tile. Pips are holes in the face, same as the real ones. -->
    <g id="bone">
      <rect x="-9" y="-34" width="18" height="34" rx="2.5" fill="#FDF6E3"/>
      <rect x="-9" y="-34" width="18" height="34" rx="2.5" fill="none"
            stroke="#5A3A1E" stroke-opacity="0.35"/>
      <line x1="-9" y1="-17" x2="9" y2="-17" stroke="#241608" stroke-opacity="0.3"/>
    </g>
  </defs>

  <!-- Midday sun. It belongs in the sky: sat low it read as a dome resting on
       the ground rather than a sun, which is why it is up here. -->
  <circle cx="600" cy="84" r="54" fill="#F4C430" opacity="0.5"/>

  <!-- The yard floor. -->
  <rect x="0" y="180" width="1200" height="3" fill="#5A3A1E" opacity="0.26"/>

  <g transform="translate(0,180)">
    <ellipse cx="150"  cy="3" rx="50" ry="5" fill="#5A3A1E" opacity="0.14"/>
    <ellipse cx="262"  cy="3" rx="32" ry="4" fill="#5A3A1E" opacity="0.12"/>
    <ellipse cx="944"  cy="3" rx="32" ry="4" fill="#5A3A1E" opacity="0.12"/>
    <ellipse cx="1046" cy="3" rx="50" ry="5" fill="#5A3A1E" opacity="0.14"/>

    <use href="#palm" transform="translate(262,0) scale(0.66)"/>
    <use href="#palm" transform="translate(944,0) scale(0.66)"/>
    <use href="#palm" transform="translate(150,0) scale(1.02)"/>
    <use href="#palm" transform="translate(1046,0) scale(1.02)"/>

    <!-- A line of bones stood up mid-yard, under the sun. Big enough to read
         as dominoes — at the old scale they vanished into speckle. -->
    <g transform="translate(600,0) scale(1.5)">
      <ellipse cx="-4" cy="2" rx="46" ry="4" fill="#5A3A1E" opacity="0.13"/>
      <use href="#bone" transform="translate(-42,0)"/>
      <use href="#bone" transform="translate(-18,0)"/>
      <use href="#bone" transform="translate(6,0)"/>
      <use href="#bone" transform="translate(32,0) rotate(9)"/>
      <g fill="#241608">
        <circle cx="-42" cy="-25" r="2.2"/>
        <circle cx="-46" cy="-9"  r="2.2"/><circle cx="-38" cy="-9" r="2.2"/>
        <circle cx="-22" cy="-29" r="2.2"/><circle cx="-14" cy="-21" r="2.2"/>
        <circle cx="-18" cy="-9"  r="2.2"/>
        <circle cx="2"   cy="-29" r="2.2"/><circle cx="10" cy="-29" r="2.2"/>
        <circle cx="2"   cy="-13" r="2.2"/><circle cx="10" cy="-13" r="2.2"/>
        <circle cx="6"   cy="-21" r="2.2"/>
      </g>
    </g>
  </g>
</svg>
